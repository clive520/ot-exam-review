<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>國考衝刺複習</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
</head>
<body>
<header>
  <div class="brand" onclick="goHome()">📚 國考衝刺複習</div>
  <div class="header-right">
    <div id="authArea" class="auth-area"></div>
  </div>
</header>

<nav class="tabs">
  <button id="tab-home" class="tab active" onclick="showView('home')">🏠 選擇科目</button>
  <button id="tab-practice" class="tab" onclick="showView('practice')">✏️ 練習</button>
  <button id="tab-wrong" class="tab" onclick="showView('wrong')">📕 錯題本</button>
  <button id="tab-stats" class="tab" onclick="showView('stats')">📊 統計</button>
  <button id="tab-admin" class="tab" style="display:none" onclick="showView('admin')">📥 管理</button>
</nav>

<main>
  <section id="view-home" class="view active">
    <div id="homeContent"></div>
  </section>

  <section id="view-practice" class="view">
    <div id="practiceContent"></div>
  </section>

  <section id="view-wrong" class="view">
    <div id="wrongContent"></div>
  </section>

  <section id="view-stats" class="view">
    <div id="statsContent"></div>
  </section>

  <section id="view-admin" class="view">
    <div id="adminContent"></div>
  </section>
</main>

<!-- 問題回報 Modal -->
<div id="reportModal" class="modal-overlay" onclick="if(event.target===this)closeReport()">
  <div class="modal">
    <h3>⚠ 回報問題</h3>
    <div class="report-ctx" id="reportSubj"></div>
    <div class="report-ctx" id="reportStem"></div>
    <label class="report-label">問題類型</label>
    <select id="reportType" class="report-input">
      <option>錯字</option>
      <option>答案錯誤</option>
      <option>圖片問題</option>
      <option>選項問題</option>
      <option>其他</option>
    </select>
    <label class="report-label">問題說明</label>
    <textarea id="reportDesc" class="report-input" rows="4" placeholder="請描述你發現的問題（例如：第 X 選項有錯字、答案與解析不符…）"></textarea>
    <div class="modal-btns">
      <button class="btn-secondary" style="margin-top:0" onclick="closeReport()">取消</button>
      <button class="btn-primary" style="margin-top:0" id="reportSubmit" onclick="submitReport()">送出回報</button>
    </div>
  </div>
</div>

<footer>題庫資料來源：考選部公開考古題（115 年職能治療師高考）</footer>

<!-- Firebase SDK（選擇性載入，firebase-config.js 有設定才會啟用） -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
